# Local development databases for the Bug Bounty Ledger.
# MySQL is published on host port 3307 so it does not clash with a MySQL
# server you may already run on 3306 for MySQL Workbench.
services:
  mysql:
    image: mysql:8.4
    container_name: abbl-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bug_bounty_ledger}
    # lower_case_table_names=1 makes table names case-insensitive, matching
    # how MySQL behaved on Windows in Phase 1 (COMPANY == company).
    # It can only be set when the data directory is first created.
    command: ["--lower-case-table-names=1", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: abbl-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API and web dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  qdrant_data:
