name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    name: Lint, typecheck, unit tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: |
          export MYSQL_ROOT_PASSWORD=ci-root-password
          export DB_AUTH_PASSWORD="$(printf '%064d' 0)"
          export DB_ADMIN_PASSWORD="$(printf '%064d' 1)"
          export DB_RESEARCHER_PASSWORD="$(printf '%064d' 2)"
          export DB_VECTOR_PASSWORD="$(printf '%064d' 3)"
          export MYSQL_HOST=127.0.0.1 MYSQL_PORT=3307 MYSQL_DATABASE=bug_bounty_ledger
          export DB_AUTH_USER=app_auth DB_ADMIN_USER=app_admin DB_RESEARCHER_USER=app_researcher DB_VECTOR_USER=app_vector
          export QDRANT_URL=http://127.0.0.1:6333 QDRANT_COLLECTION=vulnerability_reports
          export EMBEDDING_MODEL=Xenova/all-MiniLM-L6-v2 EMBEDDING_DIM=384 SIMILARITY_THRESHOLD=0.70 SESSION_TTL_HOURS=8
          npm run build
  database:
    name: MySQL + Qdrant integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure isolated CI environment
        run: |
          cp .env.example .env
          sed -i 's/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=ci-root-password/' .env
          sed -i 's/^MYSQL_PORT=.*/MYSQL_PORT=3307/' .env
          sed -i "s/^DB_AUTH_PASSWORD=.*/DB_AUTH_PASSWORD=$(printf '%064d' 0)/" .env
          sed -i "s/^DB_ADMIN_PASSWORD=.*/DB_ADMIN_PASSWORD=$(printf '%064d' 1)/" .env
          sed -i "s/^DB_RESEARCHER_PASSWORD=.*/DB_RESEARCHER_PASSWORD=$(printf '%064d' 2)/" .env
          sed -i "s/^DB_VECTOR_PASSWORD=.*/DB_VECTOR_PASSWORD=$(printf '%064d' 3)/" .env
      - run: docker compose up -d
      - run: npm run test:db
      - name: Build production app against isolated test DB
        run: |
          set -a
          source .env
          set +a
          export MYSQL_DATABASE="$MYSQL_TEST_DATABASE"
          export QDRANT_COLLECTION=vulnerability_reports_test
          npm run build
      - name: Smoke-test production HTTP routes and auth guards
        run: bash scripts/smoke-http.sh
      - if: always()
        run: docker compose down -v
